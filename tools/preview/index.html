<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ROM Store - UI preview</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0f1114; }

      /* Steam Deck frame, only used under the dev server (see preview.tsx). */
      html.deck, html.deck body, html.deck #root { background: #050607; overflow: hidden; }
      .deck-stage {
        height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      }
      .deck-box { position: relative; flex: 0 0 auto; }
      .deck-screen {
        position: absolute; left: 0; top: 0;
        width: 1280px; height: 800px;
        transform-origin: 0 0;
        overflow: hidden;
        background: #0e141b;
        outline: 1px solid rgba(255, 255, 255, 0.08);
      }
      .deck-bar {
        position: absolute; left: 0; right: 0; height: 40px; z-index: 100;
        display: flex; align-items: center; justify-content: space-between; gap: 18px;
        padding: 0 20px; box-sizing: border-box;
        font: 600 13px "Motiva Sans", "Noto Sans", sans-serif; color: #b8bcbf;
        background: #0e141b;
      }
      .deck-bar.top { top: 0; }
      .deck-bar.bottom { bottom: 0; justify-content: flex-end; border-top: 1px solid rgba(255, 255, 255, 0.06); }
      .deck-hint { display: inline-flex; align-items: center; gap: 7px; }
      .deck-hint b {
        width: 20px; height: 20px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        background: #3d4450; color: #fff; font-size: 11px;
      }
      .deck-hint b.wide { width: auto; padding: 0 6px; border-radius: 5px; }
      .deck-caption { font: 11px "Noto Sans", sans-serif; color: #5d656d; text-align: center; padding: 0 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./preview.js"></script>
  </body>
</html>
