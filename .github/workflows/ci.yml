name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend compiles
        run: python3 -m compileall -q backend main.py

      # Parsers against recorded pages, matching, library, BIOS, settings
      # migration and download resume. Offline; see tests/.
      - name: Backend tests
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the frontend bundle
        run: npm run build
