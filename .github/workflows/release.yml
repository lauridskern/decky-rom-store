name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend tests
        # A parser that broke must not ship; see tests/.
        run: python3 -m unittest discover -s tests

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend bundle
        run: npm run build

      - name: Stamp the version from the tag
        run: |
          # Decky shows the version from package.json, so it has to match the
          # release tag.
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PYEOF'
          import json, pathlib, sys
          version = sys.argv[1]
          for name in ("package.json", "package-lock.json"):
              path = pathlib.Path(name)
              data = json.loads(path.read_text())
              data["version"] = version
              if name == "package-lock.json" and "" in data.get("packages", {}):
                  data["packages"][""]["version"] = version
              path.write_text(json.dumps(data, indent=2) + "\n")
          PYEOF
          echo "version stamped: $VERSION"

      - name: Package the plugin
        run: |
          # Decky unpacks the zip straight into ~/homebrew/plugins and then
          # looks for a FOLDER that contains plugin.json, so the package needs
          # a single top level directory.
          mkdir -p package/rom-store-decky
          rsync -a \
            --exclude "node_modules/" --exclude "src/" --exclude ".git/" \
            --exclude ".github/" --exclude "__pycache__/" --exclude "*.pyc" \
            --exclude "tests/" --exclude ".claude/" \
            --exclude "dist/*.map" --exclude "tools/preview/preview.js" \
            --exclude "tools/preview/cover-preview.js" \
            --exclude "tools/preview/cover-preview.html" \
            ./ package/rom-store-decky/
          cd package && zip -qr ../ROM-Store.zip rom-store-decky

      - name: Build a compatibility package for the older asset name
        run: |
          # Decky derives the plugin name from the URL and requires
          # plugin.json to match it exactly, so ship a second asset that also
          # works with the older rom-store-decky.zip URL.
          cp -r package/rom-store-decky package/rom-store-decky-legacy
          python3 - <<'PYEOF'
          import json, pathlib
          path = pathlib.Path("package/rom-store-decky-legacy/plugin.json")
          data = json.loads(path.read_text())
          data["name"] = "rom-store-decky"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PYEOF
          cd package && zip -qr ../rom-store-decky.zip rom-store-decky-legacy

      - name: Attach the packages to a release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ROM-Store.zip
            rom-store-decky.zip
          generate_release_notes: true
