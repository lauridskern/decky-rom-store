name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend bundle
        run: npm run build

      - name: Package the plugin
        run: |
          # Decky unpacks the zip straight into ~/homebrew/plugins and then
          # looks for a FOLDER that contains plugin.json, so the package needs
          # a single top level directory.
          mkdir -p package/rom-store-decky
          rsync -a \
            --exclude "node_modules/" --exclude "src/" --exclude ".git/" \
            --exclude ".github/" --exclude "__pycache__/" --exclude "*.pyc" \
            --exclude "dist/*.map" --exclude "tools/preview/preview.js" \
            --exclude "tools/preview/cover-preview.js" \
            --exclude "tools/preview/cover-preview.html" \
            ./ package/rom-store-decky/
          cd package && zip -qr ../ROM-Store.zip rom-store-decky

      - name: Attach the package to a release
        uses: softprops/action-gh-release@v2
        with:
          files: ROM-Store.zip
          generate_release_notes: true
